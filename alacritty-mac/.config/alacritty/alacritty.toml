# ── Colors ────────────────────────────────────────────────────────────
# Zed One Dark, imported rather than pasted. alacritty/onedark.toml is the
# only Alacritty file holding hex; it is itself derived from
# nvim/.config/nvim/colors/zed-onedark.lua. Imports are applied first, so
# anything below still wins over the palette.
general.import = ["~/dotfiles/alacritty/onedark.toml"]

[env]
TERM = "xterm-256color"

[font]
normal = { family = "CaskaydiaMono Nerd Font", style = "SemiLight" }
bold = { family = "CaskaydiaMono Nerd Font", style = "Bold" }
italic = { family = "CaskaydiaMono Nerd Font", style = "Italic" }
size = 22

[window]
startup_mode = "Fullscreen"
padding.x = 0
padding.y = 0
decorations = "None"
# macOS defaults this to "None", which makes Option a compose key: Option-a
# types "å" instead of sending ESC a. That silently swallowed every Alt
# binding in tmux — the M-a prefix and the M-s status toggle both arrived as
# accented letters. "Both" so either Option key works.
option_as_alt = "Both"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
