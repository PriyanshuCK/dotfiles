add_newline = true
# Sized for the slowest box, which is the WSL one: every external command
# there crosses the Windows interop boundary and runs off /mnt/c. Measured:
# node.exe --version is ~70ms warm but ~550ms cold, so the old 200 (below
# starship's own default of 500) silently dropped modules. scan_timeout is
# raised for the same reason: DrvFs is slow. Native boxes never come close to
# either ceiling, so one value serves all of them.
command_timeout = 1000
scan_timeout = 100
format = "[$directory$git_branch$git_status]($style)$nodejs$character"

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[❯](bold yellow)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
# `style` was never set, so it fell back to starship's default "cyan bold".
# It styles $path in both formats below, which is where the stray cyan came
# from: outside a repo the whole path used it, inside a repo the tail did.
style = "yellow"
repo_root_style = "bold yellow"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic yellow"

[git_status]
# $all_status alone covers only the working-tree symbols. ahead/behind/
# diverged/up_to_date live in $ahead_behind, so without it the four settings
# below were configured but could never render.
format     = '[$all_status$ahead_behind]($style)'
style      = "yellow"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[nodejs]
# Reads `node --version` — a native node on the Mac, the ~/.local/bin shim
# from local-wsl on WSL. Dim, not accented: reference info, not active state.
format = "[$symbol$version]($style) "
style  = "bright-black"
symbol = " "
