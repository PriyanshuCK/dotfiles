# Tmux configuration
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
setw -g mode-keys vi
set -sg escape-time 10
set -g mouse on
unbind C-b
set -g prefix M-a
bind M-a send-prefix

# Let nvim see FocusGained/FocusLost, so :checktime autoread and gitsigns
# refresh when you switch panes instead of showing stale buffers.
set -g focus-events on

# Default scrollback is 2000 lines, which a single verbose build blows past.
set -g history-limit 50000

# Killing the session a client is attached to detaches that client by default,
# which closes the terminal window outright. Off switches the client to the
# most recently active remaining session instead, so the window survives and
# only the last session closing ends it.
set -g detach-on-destroy off

# Windows count from 1 (matches the number row) and close gaps on kill.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Copy to the system clipboard over OSC 52, straight through alacritty.
# No clip.exe, no pbcopy, no wl-copy — one mechanism on every box, and it
# works the same over SSH.
set -g set-clipboard on
set -ag terminal-features ",xterm-256color:clipboard"
# Nested tmux — Mac tmux, ssh, then the box's tmux. The outer server hands
# its panes TERM=tmux-256color, so the line above never matches on the inner
# server and it concludes its terminal has no clipboard: a yank there fills
# the inner paste buffer and never emits OSC 52. tmux-256color carries no Ms
# capability in terminfo and tmux infers none from the name, so the feature
# has to be declared for it as well.
set -ag terminal-features ",tmux-256color:clipboard"

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Vim-style pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# last-window moved here since l is now a pane key
bind C-l last-window

# Splits that look like what they do, opening in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# mode-keys vi was set, but tmux still bound Space/Enter to select and copy.
# These make copy-mode actually behave like vim.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# Project sessionizer: fzf over this machine's project roots, attach or create
# a session named after the directory. The roots are read from
# ~/.config/tmux-sessionizer/paths, which is the only machine-specific part —
# see the local-mac / local-wsl packages.
bind f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Status bar toggle — no prefix, single keystroke. A bare `set -g status`
# with no value toggles the option (tmux 3.x). M-s is bound in neither the
# root nor prefix table, is unused by nvim/LazyVim, and fzf only claims M-c.
# refresh-client -S redraws the status line immediately, so the peek shows
# current data instead of whatever was cached when it was last visible.
bind -n M-s set -g status \; refresh-client -S

# ── Theme ─────────────────────────────────────────────────────────────
# Deliberately hex-free. `default` keeps the terminal's own background, and
# the ANSI names resolve to Zed One Dark under alacritty-mac, and to whatever
# the attached terminal defines elsewhere — including over mosh to lifeos,
# where the local terminal paints the remote session. One file, no variant.
# Accent is yellow, to match the Obsidian vault. Blue and cyan stay off-limits
# because they carry func/tag/attr and type/operator. Yellow is not free the way
# magenta was — in the buffer it is constants, warnings and git-modified — but
# that collision never renders, since nothing on this bar sits inside a buffer.
# Off by default: the bar is a constant one-row tax on every pane, and the
# prompt already shows dir/branch/git. Peek at it with M-s when you need to
# see the session name, the window list, or whether the prefix is armed.
set -g status off
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=brightblack"
set -g status-left-length 30
set -g status-right-length 50
# tmux caches #() output and only re-runs it every status-interval, so a long
# interval leaves the previous pane's branch on screen after you switch. The
# path updates instantly (native format) which makes the mismatch obvious.
# 1s bounds the staleness; the git call costs ~45ms and only runs while the
# bar is actually visible, which is rarely, since it defaults to off.
set -g status-interval 1

set -g status-left "#[fg=yellow,bold]#S#[fg=brightblack] │ "

# Right side: branch, then the prefix indicator. The directory used to sit
# here too, but the window list now carries it, so it was saying the same
# thing twice. The helper prints nothing outside a repo, collapsing the gap.
set -g status-right "#[fg=yellow,italics]#(~/.local/bin/tmux-git-branch '#{pane_current_path}')#[default] #{?client_prefix,#[fg=yellow]● ,}"

# Each window is labelled by its directory rather than by #W (which is just
# "zsh" for every window and tells you nothing). Renaming still works: tmux
# clears automatic-rename when you run rename-window (<prefix> ,), and that
# flag is what this tests — so a name you set yourself wins and is shown.
setw -g window-status-format "#[fg=brightblack]#I #{?#{==:#{automatic-rename},0},#{window_name},#{b:pane_current_path}}"
setw -g window-status-current-format "#[fg=yellow,italics]#I #{?#{==:#{automatic-rename},0},#{window_name},#{b:pane_current_path}}"
setw -g window-status-separator "   "

set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=yellow"
set -g pane-border-lines heavy

set -g message-style "bg=default,fg=yellow"
set -g message-command-style "bg=default,fg=yellow"
set -g mode-style "bg=brightblack,fg=brightwhite"
