# Tmux configuration
set -g status off

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
setw -g mode-keys vi
set -sg escape-time 10
set -g mouse on
unbind C-b
set -g prefix M-a
bind M-a send-prefix

# Let nvim see FocusGained/FocusLost, so :checktime autoread and gitsigns
# refresh when you switch panes instead of showing stale buffers.
set -g focus-events on

# Default scrollback is 2000 lines, which a single verbose build blows past.
set -g history-limit 50000

# Windows count from 1 (matches the number row) and close gaps on kill.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Copy to the Windows clipboard over OSC 52, straight through alacritty.
# No clip.exe, no wl-copy, and it works the same over SSH.
set -g set-clipboard on
set -ag terminal-features ",xterm-256color:clipboard"

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Vim-style pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# last-window moved here since l is now a pane key
bind C-l last-window

# Splits that look like what they do, opening in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# mode-keys vi was set, but tmux still bound Space/Enter to select and copy.
# These make copy-mode actually behave like vim.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ── Theme ─────────────────────────────────────────────────────────────
# Deliberately hex-free. `default` keeps the terminal's own background, and
# the ANSI names resolve to Zed One Dark under alacritty-mac and to whatever
# theme omarchy has active — so one file serves both machines, no variant.
# Accent is magenta: One Dark's blue is func/tag/attr and its cyan is
# type/operator, so violet is the slot carrying no syntax load.
set -g status-justify left
set -g status-style "bg=default,fg=brightblack"
set -g status-left-length 30
set -g status-left "#[fg=magenta,bold]#S#[fg=brightblack] │ "

setw -g window-status-format "#[fg=brightblack]#I #W"
setw -g window-status-current-format "#[fg=magenta,italics]#I #W"
setw -g window-status-separator "   "

set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=magenta"
set -g pane-border-lines heavy

set -g message-style "bg=default,fg=magenta"
set -g message-command-style "bg=default,fg=magenta"
set -g mode-style "bg=brightblack,fg=brightwhite"
